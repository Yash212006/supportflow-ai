[project]
name = "supportflow-ai-backend"
version = "1.0.0"
description = "SupportFlow AI: autonomous customer support and financial operations API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.3",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.8",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.8",
  "pgvector==0.5.1",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "email-validator==2.3.0",
  "pyjwt==2.15.1",
  "bcrypt==5.0.0",
  "redis==8.1.0",
  "httpx==0.28.1",
  "python-multipart==0.0.33",
  "pypdf==7.0.1",
  "python-docx==1.2.0",
  "langchain-core==1.7.7",
  "langchain-openai==1.7.4",
  "langchain-google-genai==4.4.3",
  "langgraph==1.2.20",
  # APIMatic-generated PayPal Python SDK (installed by the APIMatic PayPal Context Plugin workflow)
  "paypal @ git+https://github.com/context-plugins/paypal-python-sdk.git@143e57f2a3729d7df3727386b8c9ddf023d9a5df",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-cov==7.1.0", "mypy==2.4.1", "ruff==0.17.4"]

[tool.ruff]
line-length = 200
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F", "I", "B"]
ignore = ["B008", "B905", "B007"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["integration: talks to the real PayPal Sandbox (needs credentials)"]
