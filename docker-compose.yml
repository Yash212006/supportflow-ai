# SupportFlow AI: local stack.
#   cp .env.example .env   (fill in PayPal sandbox + LLM keys, or leave blank for sample-only mode)
#   docker compose up -d --build
#   docker compose run --rm seed      # load labelled sample data (once)
#   open http://localhost:8080
name: supportflow-ai

x-backend-env: &backend-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://supportflow:${POSTGRES_PASSWORD:-supportflow}@db:5432/supportflow
    REDIS_URL: redis://redis:6379/0
    # The browser reaches the app through the frontend container, so PayPal must return there.
    # (Not read from FRONTEND_URL/CORS_ORIGINS in .env: those are for local `npm run dev` on :5173.)
    FRONTEND_URL: ${DOCKER_FRONTEND_URL:-http://localhost:${WEB_PORT:-8080}}
    CORS_ORIGINS: ${DOCKER_FRONTEND_URL:-http://localhost:${WEB_PORT:-8080}}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: supportflow
      POSTGRES_USER: supportflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supportflow}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportflow -d supportflow"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    image: supportflow-ai-backend
    <<: *backend-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["${BACKEND_PORT:-8000}:8000"]
    volumes: [uploads:/app/uploads]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 12

  # Re-checks refunds whose PayPal outcome is not yet known (same PayPal-Request-Id, never a second refund).
  reconciler:
    build: ./backend
    image: supportflow-ai-backend
    <<: *backend-env
    command: ["python", "-m", "app.workers.reconcile"]
    depends_on:
      backend: { condition: service_healthy }

  # One-off: `docker compose run --rm seed` (add `--reset` to rebuild). Every seeded record is labelled sample data.
  seed:
    build: ./backend
    image: supportflow-ai-backend
    <<: *backend-env
    command: ["python", "-m", "app.seed"]
    profiles: ["tools"]
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    image: supportflow-ai-frontend
    build:
      context: ./frontend
      args:
        VITE_AG_LICENSE_KEY: ${VITE_AG_LICENSE_KEY:-}
    depends_on:
      backend: { condition: service_healthy }
    ports: ["${WEB_PORT:-8080}:80"]

volumes:
  pgdata:
  uploads:
