# Render Blueprint: free hosted demo of SupportFlow AI.
# Render dashboard -> New -> Blueprint -> pick this repo. You are prompted for every `sync: false` value.
# Free web services sleep after ~15 minutes idle; the first request then takes about a minute to wake.
# The reconciler worker is not included (background workers are not free); managers can reconcile from Refunds.

databases:
  - name: supportflow-db
    plan: free
    databaseName: supportflow
    user: supportflow

services:
  - type: keyvalue
    name: supportflow-redis
    plan: free
    ipAllowList: []          # internal connections only

  - type: web
    name: supportflow-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: { name: supportflow-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: supportflow-redis, property: connectionString }
      - key: SEED_ON_START          # loads labelled sample data once; later starts are a no-op
        value: "true"
      - key: DEMO_CURRENCY          # USD so live Sandbox captures and refunds work
        value: USD
      - key: RATE_LIMIT_PER_MINUTE  # behind Render's proxy several visitors can share one IP
        value: "600"
      - key: AUTH_RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: FRONTEND_URL           # e.g. https://supportflow-web.onrender.com (PayPal return URL)
        sync: false
      - key: CORS_ORIGINS           # same value as FRONTEND_URL
        sync: false
      - key: PUBLIC_API_URL         # e.g. https://supportflow-api.onrender.com
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID      # webhook URL: <PUBLIC_API_URL>/api/paypal/webhooks
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: supportflow-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL           # the API's public URL, e.g. https://supportflow-api.onrender.com
        sync: false
      - key: VITE_AG_LICENSE_KEY    # optional; empty shows the AG Studio evaluation watermark
        sync: false
